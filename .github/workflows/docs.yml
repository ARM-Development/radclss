name: Documentation

on:
  # Automatic runs are disabled. This build needs no GitHub Pages access, but
  # it fails its sphinx-build -W check on 16 pre-existing warnings, and it is
  # turned off alongside Deploy Documentation until docs CI is revisited.
  # Re-enable by restoring the pull_request and schedule triggers below.
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 7

      - name: Check for warnings
        run: |
          cd docs
          # Rebuild with warnings as errors to catch issues
          make clean
          sphinx-build -W -b html . _build/html
