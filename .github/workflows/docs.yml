name: Documentation

on:
  # Automatic runs are disabled. This build needs no GitHub Pages access, but
  # it fails its sphinx-build -W check on 16 pre-existing warnings, and it is
  # turned off alongside Deploy Documentation until docs CI is revisited.
  # Re-enable by restoring the pull_request and schedule triggers below.
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Build documentation
        run: |
          cd docs
          make html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 7

      - name: Check for warnings
        run: |
          cd docs
          # Rebuild with warnings as errors to catch issues
          make clean
          sphinx-build -W -b html . _build/html
